<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو فيستيفال</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#4a0e1b;--wine2:#5e1526;--wine3:#74203a;--gold:#d9a94f;--gold2:#f2cf86;--cream:#f8eed7;--mute:#cdb792;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--wine);color-scheme:dark;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--wine);color:var(--cream);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wine);z-index:10}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.hero{text-align:center;padding:30px 16px 18px}
.plaque{display:inline-block;background:var(--cream);border:3px solid var(--gold);border-radius:28px;padding:10px 28px;box-shadow:0 0 0 6px var(--wine),0 0 0 8px var(--gold)}
.plaque img{display:block;width:min(300px,68vw);height:auto}
.hero h1{font:700 1.6rem "Reem Kufi",Cairo,sans-serif;color:var(--gold2);margin:28px 0 2px}
.hero p{margin:0;color:var(--mute);font-size:.92rem}
.call{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.call a{color:var(--wine);background:var(--gold);padding:7px 20px;border-radius:99px;text-decoration:none;font-weight:700;direction:ltr}
.search{max-width:540px;margin:18px auto 0}
.search input{width:100%;padding:12px 20px;border-radius:99px;border:1.5px solid var(--gold);background:var(--wine2);color:var(--cream);font:inherit}
.search input::placeholder{color:var(--mute)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wine);border-bottom:1px solid var(--wine3)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
#tabs button{flex:none;font:600 .95rem Cairo,sans-serif;color:var(--gold2);background:transparent;border:1.5px solid var(--gold);border-radius:99px;padding:5px 16px;cursor:pointer}
#tabs button[aria-pressed=true]{background:var(--gold);color:var(--wine)}
main{max-width:980px;margin:0 auto;padding:6px 16px 36px;min-height:60vh}
.cat{font:700 1.8rem "Reem Kufi",Cairo,sans-serif;color:var(--gold2);margin:22px 0 0}
.sub{font:700 1.05rem Cairo,sans-serif;color:var(--gold);margin:22px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--wine3)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:0 32px}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(217,169,79,.3)}
.it h4{margin:0;font-size:1rem;font-weight:600}
.it p{margin:2px 0 0;font-size:.82rem;color:var(--mute);line-height:1.5}
.prs{display:flex;gap:6px;flex:none}
.pr{display:flex;flex-direction:column;align-items:center;min-width:48px;background:var(--wine2);border:1px solid var(--wine3);border-radius:10px;padding:1px 8px}
.pr small{font-size:.7rem;color:var(--mute)}
.pr b{color:var(--gold2);font-size:1.05rem}
.pr b::after{content:" ج";font-size:.7rem;font-weight:400;color:var(--mute)}
.pr.one{background:none;border:0}
.extra{margin-top:28px;background:var(--wine2);border:1px solid var(--gold);border-radius:16px;padding:6px 20px 10px}
.extra .sub{border:0;margin-top:12px}
.empty{text-align:center;color:var(--mute);padding:60px 0}
footer{text-align:center;padding:24px 16px 32px;color:var(--mute);border-top:1px solid var(--wine3)}
footer .call{margin-top:10px}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
